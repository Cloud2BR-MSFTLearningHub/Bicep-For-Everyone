name: Validate Bicep and deploy documentation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Bicep CLI without Azure login
        run: |
          az bicep install
          az bicep version
      - name: Compile and lint every Bicep entry point
        run: python .github/scripts/validate_bicep.py
      - name: Check documentation synchronization
        run: python .github/scripts/generate_catalog.py --check
      - name: Build website in strict mode
        run: python -m mkdocs build --strict
      - name: Check generated local links and assets
        run: python .github/scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-bicep
          path: build/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
